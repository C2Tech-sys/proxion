name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/c2tech-sys/proxion

jobs:
  image:
    name: Build and push container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Proxion
            org.opencontainers.image.description=A modern, open-source web console for Proxmox VE
            org.opencontainers.image.source=https://github.com/C2Tech-sys/proxion
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROXION_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract CHANGELOG section for this tag
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const text = fs.readFileSync("CHANGELOG.md", "utf8");
            const lines = text.split("\n");
            const startRe = new RegExp("^## \\[" + version.replace(/\./g, "\\.") + "\\]");
            const start = lines.findIndex((l) => startRe.test(l));
            if (start === -1) {
              console.error("No CHANGELOG section found for version " + version);
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && /^## \[/.test(l));
            if (end === -1) end = lines.length;
            console.log(lines.slice(start + 1, end).join("\n").trim());
          ' "$version" > /tmp/release-notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Proxion v${{ steps.notes.outputs.version }}
          body_path: /tmp/release-notes.md
          generate_release_notes: false
